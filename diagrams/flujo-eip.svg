<svg viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1300" height="620" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1a1a1a">Flujo de integración SIPAP QR - Apache Camel (notación EIP)</text>

  <!-- Productores -->
  <rect x="20" y="70" width="170" height="60" rx="6" fill="#fde68a" stroke="#b45309"/>
  <text x="105" y="95" font-size="12" text-anchor="middle">Productor</text>
  <text x="105" y="112" font-size="12" text-anchor="middle">App móvil (timer)</text>

  <rect x="20" y="150" width="170" height="60" rx="6" fill="#fde68a" stroke="#b45309"/>
  <text x="105" y="175" font-size="12" text-anchor="middle">Productor</text>
  <text x="105" y="192" font-size="12" text-anchor="middle">Billetera (timer)</text>

  <!-- Message Channel entrada -->
  <rect x="240" y="110" width="150" height="50" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="315" y="130" font-size="11" text-anchor="middle">Message Channel</text>
  <text x="315" y="146" font-size="11" text-anchor="middle">direct:sipap-in</text>

  <!-- Wire tap -->
  <rect x="430" y="30" width="150" height="50" rx="4" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="505" y="50" font-size="11" text-anchor="middle">Wire Tap</text>
  <text x="505" y="66" font-size="11" text-anchor="middle">direct:audit</text>

  <!-- Pipes and filters -->
  <rect x="430" y="110" width="150" height="50" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="505" y="128" font-size="11" text-anchor="middle">Parseo TLV</text>
  <text x="505" y="144" font-size="11" text-anchor="middle">(Pipes &amp; Filters)</text>

  <rect x="620" y="110" width="160" height="50" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="700" y="128" font-size="11" text-anchor="middle">Validación</text>
  <text x="700" y="144" font-size="11" text-anchor="middle">(Message Filter)</text>

  <rect x="820" y="110" width="170" height="50" rx="4" fill="#bbf7d0" stroke="#15803d"/>
  <text x="905" y="128" font-size="11" text-anchor="middle">Transformación</text>
  <text x="905" y="144" font-size="11" text-anchor="middle">(Message Translator)</text>

  <!-- Dead letter -->
  <rect x="620" y="30" width="160" height="50" rx="4" fill="#fecaca" stroke="#b91c1c"/>
  <text x="700" y="50" font-size="11" text-anchor="middle">Dead Letter Channel</text>
  <text x="700" y="66" font-size="11" text-anchor="middle">direct:dead-letter</text>

  <!-- Rechazo -->
  <rect x="820" y="190" width="170" height="50" rx="4" fill="#fecaca" stroke="#b91c1c"/>
  <text x="905" y="210" font-size="11" text-anchor="middle">Rechazo de negocio</text>
  <text x="905" y="226" font-size="11" text-anchor="middle">direct:rechazo</text>

  <!-- CBR -->
  <polygon points="1030,135 1090,110 1150,135 1090,160" fill="#fef08a" stroke="#a16207"/>
  <text x="1090" y="138" font-size="10" text-anchor="middle">CBR</text>

  <!-- Consumidores -->
  <rect x="1150" y="30" width="130" height="50" rx="4" fill="#a7f3d0" stroke="#047857"/>
  <text x="1215" y="50" font-size="11" text-anchor="middle">Consumidor</text>
  <text x="1215" y="66" font-size="11" text-anchor="middle">ITAU</text>

  <rect x="1150" y="110" width="130" height="50" rx="4" fill="#a7f3d0" stroke="#047857"/>
  <text x="1215" y="130" font-size="11" text-anchor="middle">Consumidor</text>
  <text x="1215" y="146" font-size="11" text-anchor="middle">ATLAS</text>

  <rect x="1150" y="190" width="130" height="50" rx="4" fill="#a7f3d0" stroke="#047857"/>
  <text x="1215" y="210" font-size="11" text-anchor="middle">Consumidor</text>
  <text x="1215" y="226" font-size="11" text-anchor="middle">FAMILIAR</text>

  <!-- Resultado -->
  <rect x="620" y="290" width="220" height="50" rx="4" fill="#e0e7ff" stroke="#3730a3"/>
  <text x="730" y="310" font-size="11" text-anchor="middle">Resultado final (JSON)</text>
  <text x="730" y="326" font-size="11" text-anchor="middle">direct:resultado — Correlation Identifier</text>

  <!-- Arrows -->
  <line x1="190" y1="100" x2="240" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="180" x2="240" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="135" x2="505" y2="80" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="390" y1="135" x2="430" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="135" x2="620" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="505" y1="110" x2="600" y2="60" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="780" y1="135" x2="820" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="160" x2="820" y2="205" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="990" y1="135" x2="1030" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1150" y1="130" x2="1090" y2="150" stroke="#333" stroke-width="1.2"/>
  <line x1="1090" y1="130" x2="1215" y2="80" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1090" y1="140" x2="1215" y2="130" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1090" y1="150" x2="1215" y2="200" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1090" y1="155" x2="990" y2="215" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="700" y1="80" x2="700" y2="290" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="905" y1="240" x2="800" y2="290" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1215" y1="80" x2="800" y2="300" stroke="#047857" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1215" y1="160" x2="800" y2="310" stroke="#047857" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1215" y1="240" x2="800" y2="320" stroke="#047857" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="20" y="400" font-size="12" font-weight="bold">Leyenda de patrones EIP aplicados:</text>
  <text x="20" y="420" font-size="11">🟨 Message Channel (direct:*)   🟩 Pipes and Filters / Message Filter / Message Translator</text>
  <text x="20" y="438" font-size="11">🟪 Wire Tap (auditoría)          🟥 Dead Letter Channel / Rechazo de negocio</text>
  <text x="20" y="456" font-size="11">🟦 Content-Based Router (choice según codigo_entidad)   🟦 Correlation Identifier (idTransaccion en todo el flujo)</text>
  <text x="20" y="480" font-size="11" fill="#555">Nota: este SVG es una referencia. Para la entrega se recomienda recrear</text>
  <text x="20" y="497" font-size="11" fill="#555">el diagrama en draw.io usando el stencil oficial de Enterprise Integration Patterns.</text>
</svg>
